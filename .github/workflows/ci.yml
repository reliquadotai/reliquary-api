name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24.21.0]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: |
          mkdir -p test-results
          node --test --test-reporter=spec --test-reporter=junit \
            --test-reporter-destination=stdout --test-reporter-destination=test-results/unit.xml test/*.test.mjs
      - name: Prepare unit test summary
        if: always()
        run: |
          python - <<'PY_SUMMARY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('test-results/unit.xml')
          if report.is_file():
              cases = list(ET.parse(report).getroot().iter('testcase'))
              summary = {'suite': 'unit', 'revision': os.environ['GITHUB_SHA'], 'tests': len(cases)}
              summary.update({name: sum(case.find(tag) is not None for case in cases)
                              for name, tag in [('failures', 'failure'), ('errors', 'error'), ('skipped', 'skipped')]})
              Path('test-results/unit-summary.json').write_text(json.dumps(summary) + '\n')
          PY_SUMMARY
      - name: Retain unit test summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-node-${{ matrix.node }}
          path: test-results/unit-summary.json
          retention-days: 7
          if-no-files-found: warn
      - run: npm pack --dry-run
